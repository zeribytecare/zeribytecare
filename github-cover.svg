<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640">
<stop offset="0%" stop-color="#08111f"/>
<stop offset="50%" stop-color="#0f1b33"/>
<stop offset="100%" stop-color="#08111f"/>
</linearGradient>

<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="100%" stop-color="#8b5cf6"/>
</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="80"/>
</filter>

<style>
.title{
font:700 68px 'Segoe UI',Arial,sans-serif;
fill:white;
letter-spacing:-1px;
}
.sub{
font:500 24px 'Segoe UI',Arial,sans-serif;
fill:#b8c4d9;
}
.code{
font:600 18px Consolas,monospace;
fill:#9ee7ff;
}
.small{
font:500 18px 'Segoe UI',Arial,sans-serif;
fill:#94a3b8;
}
</style>
</defs>

<rect width="1280" height="640" fill="url(#bg)"/>

<circle cx="180" cy="120" r="140" fill="#22d3ee" opacity=".18" filter="url(#blur)">
<animate attributeName="cx" values="180;260;180" dur="10s" repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="520" r="170" fill="#8b5cf6" opacity=".16" filter="url(#blur)">
<animate attributeName="cy" values="520;420;520" dur="12s" repeatCount="indefinite"/>
</circle>

<g opacity=".08">
<path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280" stroke="#fff"/>
<path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640" stroke="#fff"/>
</g>

<rect x="700" y="120" width="470" height="340" rx="22" fill="#0b1426" stroke="#22324d"/>

<circle cx="730" cy="145" r="6" fill="#ff5f56"/>
<circle cx="752" cy="145" r="6" fill="#ffbd2e"/>
<circle cx="774" cy="145" r="6" fill="#27c93f"/>

<text x="730" y="205" class="code">const developer = {</text>
<text x="760" y="240" class="code">name: "Jerywin",</text>
<text x="760" y="275" class="code">role: "Software Developer",</text>
<text x="760" y="310" class="code">mindset: "Build • Secure • Scale"</text>
<text x="730" y="350" class="code">}</text>

<rect x="760" y="385" width="0" height="4" fill="#22d3ee">
<animate attributeName="width" values="0;260;0" dur="3.5s" repeatCount="indefinite"/>
</rect>

<text x="90" y="220" class="title">Jerywin Bayawan</text>
<text x="90" y="270" class="sub">Software Developer • Full‑Stack Engineer</text>
<text x="90" y="330" class="small">Building secure, scalable, production‑ready applications.</text>

<path d="M90 380H350" stroke="url(#accent)" stroke-width="6" stroke-linecap="round">
<animate attributeName="stroke-dasharray" values="0 260;260 0;0 260" dur="4s" repeatCount="indefinite"/>
</path>

<g>
<circle cx="100" cy="520" r="5" fill="#22d3ee">
<animate attributeName="cx" values="100;1180;100" dur="14s" repeatCount="indefinite"/>
</circle>
<path d="M100 520H1180" stroke="#1e293b" stroke-width="2"/>
</g>

</svg>